[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuentas-claras-server"
version = "0.1.0"
description = "Fundación del backend de Cuentas Claras."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "cloudinary>=1.46",
  "Pillow>=12.3",
  "fastapi[standard]>=0.115",
  "google-genai>=2.21",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.10",
  "reportlab>=4.2",
  "sqlalchemy>=2.0",
  "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = ["."]
