name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  WORKING_DIRECTORY: 'app/server'
  # CAMBIA ESTO por el nombre exacto de tu Web App / App Service en Azure:
  AZURE_WEBAPP_NAME: 'cuentas-claras-api'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '${{ env.WORKING_DIRECTORY }}/requirements.txt'

      - name: Validar instalación
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.WORKING_DIRECTORY }}
