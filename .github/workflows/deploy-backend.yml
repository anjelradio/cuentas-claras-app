name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Permite disparar el deploy manualmente con un clic en GitHub

env:
  PYTHON_VERSION: '3.12'
  WORKING_DIRECTORY: 'app/server'
  # CAMBIA ESTO por el nombre exacto de tu Web App / App Service en Azure:
  AZURE_WEBAPP_NAME: 'cuentas-claras-api'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '${{ env.WORKING_DIRECTORY }}/requirements.txt'

      - name: Instalar dependencias para Azure
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          python -m pip install --upgrade pip
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Empaquetar backend
        run: |
          cd ${{ env.WORKING_DIRECTORY }}
          zip -r ../../backend-release.zip . -x "venv/*" ".venv/*" "__pycache__/*" "*/__pycache__/*" "*.pyc" ".pytest_cache/*" ".ruff_cache/*" ".mypy_cache/*" ".env"

      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend-release.zip
